<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>火影忍者手游武斗赛BP工具</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans SC","Microsoft YaHei",-apple-system,sans-serif;background:#080b12;background-image:radial-gradient(circle at 50% -20%, #1c2642 0%, #080b12 60%);color:#c9d1d9;padding:16px;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:#f0c040}

header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;background:rgba(22,27,34,.75);backdrop-filter:blur(12px);padding:12px 16px;border-radius:14px;border:1px solid rgba(240,192,64,.15);box-shadow:0 8px 32px rgba(0,0,0,.5)}
h1{font-size:18px;color:#f0c040;margin-right:8px;white-space:nowrap;text-shadow:0 0 12px rgba(240,192,64,.4);letter-spacing:1px}
.name-input{background:rgba(13,17,23,.8);border:1px solid rgba(48,54,61,.8);color:#fff;padding:8px 12px;border-radius:8px;width:130px;font-size:13px;outline:none;transition:.2s}
.name-input.blue{border-color:rgba(59,130,246,.5)}
.name-input.red{border-color:rgba(239,68,68,.5)}
.name-input:focus{border-color:#f0c040;box-shadow:0 0 10px rgba(240,192,64,.3)}
#status{flex:1;background:rgba(13,17,23,.8);padding:8px 14px;border-radius:8px;font-weight:700;color:#f0c040;min-width:180px;font-size:13px;border:1px solid rgba(48,54,61,.8);letter-spacing:.5px}
button{background:rgba(33,38,45,.8);color:#e6edf3;border:1px solid rgba(48,54,61,.8);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;transition:.2s;white-space:nowrap;backdrop-filter:blur(4px)}
button:hover{background:rgba(48,54,61,.9);border-color:rgba(240,192,64,.5);color:#f0c040;transform:translateY(-1px)}
button.primary{background:rgba(35,134,54,.8);border-color:rgba(46,160,67,.8);color:#fff}
button.primary:hover{background:rgba(46,160,67,.9);border-color:#2ea043;box-shadow:0 0 15px rgba(46,160,67,.4)}
button.danger{background:rgba(160,48,48,.8);border-color:rgba(192,64,64,.8);color:#fff}
button.danger:hover{background:rgba(192,64,64,.9);border-color:#c04040;box-shadow:0 0 15px rgba(192,64,64,.4)}
button.avatar-btn{background:rgba(111,66,193,.8);border-color:rgba(137,87,229,.8);color:#fff}
button.avatar-btn:hover{background:rgba(137,87,229,.9);border-color:#8957e5;box-shadow:0 0 15px rgba(137,87,229,.4)}
button.avatar-btn.active{background:#f0c040;color:#0d1117;border-color:#f0c040;font-weight:900;box-shadow:0 0 20px rgba(240,192,64,.6)}
label.file-btn{background:rgba(33,38,45,.8);color:#e6edf3;border:1px solid rgba(48,54,61,.8);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;transition:.2s;display:inline-block;backdrop-filter:blur(4px)}
label.file-btn:hover{background:rgba(48,54,61,.9);border-color:rgba(240,192,64,.5);color:#f0c040}

main{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.side{background:rgba(22,27,34,.7);border-radius:16px;padding:16px;border:1px solid rgba(48,54,61,.6);backdrop-filter:blur(8px);transition:.3s;position:relative;overflow:hidden}
.side.blue{border-color:rgba(59,130,246,.4);box-shadow:0 0 30px rgba(59,130,246,.1) inset}
.side.blue:hover{border-color:rgba(59,130,246,.8);box-shadow:0 0 30px rgba(59,130,246,.2) inset,0 0 20px rgba(59,130,246,.2)}
.side.red{border-color:rgba(239,68,68,.4);box-shadow:0 0 30px rgba(239,68,68,.1) inset}
.side.red:hover{border-color:rgba(239,68,68,.8);box-shadow:0 0 30px rgba(239,68,68,.2) inset,0 0 20px rgba(239,68,68,.2)}
.side h2{font-size:15px;margin-bottom:12px;text-align:center;padding-bottom:10px;border-bottom:1px solid rgba(48,54,61,.6);letter-spacing:2px}
.side h2.blue{color:#58a6ff;text-shadow:0 0 10px rgba(88,166,255,.5)}
.side h2.red{color:#ff7b72;text-shadow:0 0 10px rgba(255,123,114,.5)}
.slot-row{margin-bottom:12px}
.slot-row>b{color:#8b949e;font-size:11px;font-weight:700;display:block;margin-bottom:6px;letter-spacing:1px;text-transform:uppercase}
.mini-grid{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;align-items:center}
.mini-card{width:48px;height:48px;border-radius:8px;background:rgba(13,17,23,.8);border:2px solid rgba(48,54,61,.8);overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;transition:.2s}
.mini-card img{width:100%;height:100%;object-fit:cover}
.mini-card.ban{border-color:#a03030;opacity:.6;filter:grayscale(.6)}
.mini-card.pick-blue{border-color:#3b82f6;box-shadow:0 0 10px rgba(59,130,246,.3)}
.mini-card.pick-red{border-color:#ef4444;box-shadow:0 0 10px rgba(239,68,68,.3)}

.pool{background:rgba(22,27,34,.7);border-radius:16px;padding:16px;border:1px solid rgba(48,54,61,.6);backdrop-filter:blur(8px);margin-bottom:16px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{padding:8px 20px;font-size:13px;font-weight:700;border-radius:8px;letter-spacing:1px}
.tab.active{background:linear-gradient(135deg, #1f6feb, #3b82f6);color:#fff;border-color:#3b82f6;box-shadow:0 0 15px rgba(59,130,246,.4)}
.filters{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.filters input,.filters select{background:rgba(13,17,23,.8);border:1px solid rgba(48,54,61,.8);color:#e6edf3;padding:8px 12px;border-radius:8px;font-size:13px;outline:none;transition:.2s}
.filters input{flex:1;min-width:150px}
.filters input:focus,.filters select:focus{border-color:#f0c040;box-shadow:0 0 10px rgba(240,192,64,.2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;max-height:520px;overflow-y:auto;padding-right:6px}

.card{background:rgba(13,17,23,.8);border:1px solid rgba(48,54,61,.6);border-radius:12px;padding:10px 6px;cursor:pointer;text-align:center;position:relative;font-size:11px;transition:.25s cubic-bezier(.4,0,.2,1);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:110px}
.card:hover{background:rgba(30,38,50,.9);transform:translateY(-4px);border-color:rgba(240,192,64,.5);box-shadow:0 8px 20px rgba(0,0,0,.4),0 0 15px rgba(240,192,64,.15)}
.card.used{opacity:.35;cursor:not-allowed;filter:grayscale(.8);transform:none!important;border-color:rgba(48,54,61,.6)!important;box-shadow:none!important}
.card.used:hover{transform:none!important;border-color:rgba(48,54,61,.6)!important}
.card.avatar-mode{cursor:crosshair;border-color:rgba(137,87,229,.6)}
.card.avatar-mode:hover{border-color:#f0c040;box-shadow:0 0 20px rgba(240,192,64,.4),0 0 40px rgba(240,192,64,.1)}
.card .thumb{width:70px;height:70px;margin-bottom:6px;border-radius:10px;overflow:hidden;background:rgba(22,27,34,.8);display:flex;align-items:center;justify-content:center;border:1px solid rgba(48,54,61,.4);flex-shrink:0}
.card .thumb img{width:100%;height:100%;object-fit:cover}
.card .name{font-weight:700;line-height:1.3;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:28px;word-break:break-all;color:#e6edf3;font-size:11px}
.card .rank{color:#8b949e;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;letter-spacing:1px}
.card .badge{position:absolute;top:6px;right:6px;font-size:9px;padding:2px 6px;border-radius:4px;font-weight:900;z-index:2;letter-spacing:1px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.badge.ban{background:#dc2626;color:#fff}
.badge.blue{background:#2563eb;color:#fff}
.badge.red{background:#dc2626;color:#fff}

.history-panel{background:rgba(22,27,34,.7);border-radius:16px;padding:16px;border:1px solid rgba(48,54,61,.6);backdrop-filter:blur(8px)}
.history-panel h3{font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;color:#f0c040;letter-spacing:1px}
.history-item{background:rgba(13,17,23,.6);border:1px solid rgba(48,54,61,.6);border-left:3px solid #f0c040;border-radius:8px;padding:10px 14px;margin-bottom:8px;font-size:12px;transition:.2s}
.history-item:hover{background:rgba(30,38,50,.8);border-color:rgba(240,192,64,.4);transform:translateX(4px)}
.history-time{color:#8b949e;font-size:11px;font-weight:700}
.history-names{font-weight:900;color:#f0c040;margin:4px 0;font-size:13px}
.history-result{margin:6px 0;padding:6px 12px;border-radius:6px;font-weight:900;font-size:12px;display:inline-block;letter-spacing:1px}
.history-result.blue{background:rgba(59,130,246,.15);color:#58a6ff;border:1px solid rgba(59,130,246,.4)}
.history-result.red{background:rgba(239,68,68,.15);color:#ff7b72;border:1px solid rgba(239,68,68,.4)}
.history-result.none{background:rgba(139,148,158,.1);color:#8b949e;border:1px solid rgba(139,148,158,.3)}
.history-summary{color:#8b949e;font-size:11px;line-height:1.6}
.history-actions{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.history-actions button{font-size:11px;padding:4px 10px;font-weight:700}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
.modal.show{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-content{background:rgba(22,27,34,.95);padding:24px;border-radius:16px;width:420px;max-width:100%;display:flex;flex-direction:column;gap:14px;border:1px solid rgba(240,192,64,.2);box-shadow:0 20px 60px rgba(0,0,0,.8);max-height:90vh;overflow-y:auto}
.modal-content h3{font-size:16px;color:#f0c040;letter-spacing:2px;text-align:center;text-shadow:0 0 10px rgba(240,192,64,.3)}
.modal-content label{display:flex;flex-direction:column;gap:8px;font-size:13px;color:#8b949e;font-weight:700}
.modal-content input,.modal-content select{background:rgba(13,17,23,.8);border:1px solid rgba(48,54,61,.8);color:#e6edf3;padding:10px 12px;border-radius:8px;font-size:13px;outline:none;width:100%;transition:.2s}
.modal-content input:focus,.modal-content select:focus{border-color:#f0c040;box-shadow:0 0 12px rgba(240,192,64,.2)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.preview-img{width:110px;height:110px;object-fit:cover;border-radius:12px;border:2px solid rgba(240,192,64,.3);margin-top:8px;align-self:center;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.hint{font-size:11px;color:#6e7681;line-height:1.6;margin-top:6px;background:rgba(13,17,23,.6);padding:8px 10px;border-radius:6px;border-left:3px solid #f0c040}

/* 赛果选择按钮 */
.choice-group{display:flex;gap:8px;flex-wrap:wrap}
.choice-btn{flex:1;min-width:80px;padding:12px 8px;background:rgba(13,17,23,.8);border:2px solid rgba(48,54,61,.8);border-radius:10px;cursor:pointer;transition:.2s;font-weight:700;font-size:13px;color:#c9d1d9;text-align:center}
.choice-btn:hover{background:rgba(30,38,50,.9);border-color:rgba(240,192,64,.4);transform:translateY(-2px)}
.choice-btn.active{font-weight:900;box-shadow:0 0 15px rgba(240,192,64,.3)}
.choice-btn[data-winner="blue"].active{background:rgba(59,130,246,.2);border-color:#3b82f6;color:#58a6ff;box-shadow:0 0 15px rgba(59,130,246,.4)}
.choice-btn[data-winner="red"].active{background:rgba(239,68,68,.2);border-color:#ef4444;color:#ff7b72;box-shadow:0 0 15px rgba(239,68,68,.4)}
.choice-btn[data-result].active{background:rgba(240,192,64,.15);border-color:#f0c040;color:#f0c040}
.section-title{font-size:12px;color:#8b949e;font-weight:900;letter-spacing:1.5px;margin-top:4px;text-transform:uppercase}

@media (max-width:720px){
  body{padding:8px}
  main{grid-template-columns:1fr;gap:10px}
  header{padding:10px;gap:6px}
  h1{font-size:15px;width:100%;text-align:center;margin-bottom:4px}
  .name-input{flex:1;min-width:0;width:auto}
  #status{order:99;flex-basis:100%;font-size:12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr));max-height:400px}
  .card .thumb{width:56px;height:56px}
  .card{min-height:100px}
  .modal-content{padding:16px}
  button{padding:7px 10px;font-size:12px}
  .tab{padding:6px 14px;font-size:12px}
}
</style>
</head>
<body>

<header>
  <h1>🔥 武斗赛BP</h1>
  <input id="blueNameInput" class="name-input blue" placeholder="蓝方选手" oninput="setPlayerName('blue',this.value)">
  <input id="redNameInput" class="name-input red" placeholder="红方选手" oninput="setPlayerName('red',this.value)">
  <div id="status">准备开始</div>
  <button id="avatarModeBtn" class="avatar-btn" onclick="toggleAvatarMode()">🖼 设置头像</button>
  <button class="primary" onclick="saveBPHistory()">💾 保存记录</button>
  <button onclick="resetBP()">重置BP</button>
  <button onclick="openAddModal()">+ 添加内容</button>
  <button onclick="exportData()">导出数据</button>
  <label class="file-btn">导入数据<input type="file" hidden accept=".json" onchange="importData(event)"></label>
</header>

<main>
  <div class="side blue">
    <h2 class="blue" id="blueTitle">蓝方</h2>
    <div class="slot-row"><b>禁用忍者</b><div class="mini-grid" id="blueBansGrid"></div></div>
    <div class="slot-row"><b>出战忍者</b><div class="mini-grid" id="bluePicksGrid"></div></div>
    <div class="slot-row"><b>秘卷</b><div class="mini-grid" id="blueScrollsGrid"></div></div>
    <div class="slot-row"><b>通灵</b><div class="mini-grid" id="blueSummonsGrid"></div></div>
  </div>
  <div class="side red">
    <h2 class="red" id="redTitle">红方</h2>
    <div class="slot-row"><b>禁用忍者</b><div class="mini-grid" id="redBansGrid"></div></div>
    <div class="slot-row"><b>出战忍者</b><div class="mini-grid" id="redPicksGrid"></div></div>
    <div class="slot-row"><b>秘卷</b><div class="mini-grid" id="redScrollsGrid"></div></div>
    <div class="slot-row"><b>通灵</b><div class="mini-grid" id="redSummonsGrid"></div></div>
  </div>
</main>

<section class="pool">
  <div class="tabs">
    <button class="tab active" data-tab="ninjas" onclick="switchTab('ninjas')">忍者</button>
    <button class="tab" data-tab="scrolls" onclick="switchTab('scrolls')">秘卷</button>
    <button class="tab" data-tab="summons" onclick="switchTab('summons')">通灵</button>
  </div>
  <div class="filters">
    <input id="search" placeholder="搜索名称..." oninput="renderPool()">
    <select id="rankFilter" onchange="renderPool()">
      <option value="">全部等级</option>
      <option value="S">S级</option>
      <option value="A">A级</option>
      <option value="B">B级</option>
      <option value="C">C级</option>
    </select>
  </div>
  <div id="poolGrid" class="grid"></div>
</section>

<section class="history-panel">
  <h3>BP历史记录 <button class="danger" style="font-size:11px;padding:4px 10px" onclick="clearHistory()">清空</button></h3>
  <div id="historyList"></div>
</section>

<!-- 添加内容弹窗 -->
<div id="addModal" class="modal">
  <div class="modal-content">
    <h3>添加新内容</h3>
    <label>类型
      <select id="addType" onchange="updateAddForm()">
        <option value="ninja">忍者</option>
        <option value="scroll">秘卷</option>
        <option value="summon">通灵</option>
      </select>
    </label>
    <label>名称
      <input id="addName" placeholder="如：漩涡鸣人「仙人模式」">
    </label>
    <div id="addExtra"></div>
    <label>图片（可选，建议100×100以内）
      <input type="file" id="addImage" accept="image/*" onchange="previewImage(event)">
      <img id="imagePreview" class="preview-img" style="display:none">
    </label>
    <div class="modal-actions">
      <button onclick="closeAddModal()">取消</button>
      <button class="primary" onclick="addItem()">确认添加</button>
    </div>
  </div>
</div>

<!-- 头像设置弹窗 -->
<div id="avatarModal" class="modal">
  <div class="modal-content">
    <h3>设置头像</h3>
    <div id="avatarItemInfo" style="color:#f0c040;font-size:14px;text-align:center;font-weight:700"></div>
    <div class="hint" style="margin-top:0">
      💡 <b>推荐方式（所有人可见）</b>：把图片命名为 <code>images/{ID}.png</code> 上传到仓库的 images 文件夹，这里会自动加载，不用手动设置。
    </div>
    <label>📁 上传本地图片（仅自己可见）
      <input type="file" id="avatarFile" accept="image/*" onchange="previewAvatar(event)">
    </label>
    <label>🔗 或输入图片URL / 相对路径
      <input id="avatarUrl" placeholder="images/n01.png" oninput="previewAvatarUrl(this.value)">
    </label>
    <img id="avatarPreview" class="preview-img" style="display:none">
    <div class="modal-actions">
      <button class="danger" onclick="clearAvatar()">清除头像</button>
      <button onclick="closeAvatarModal()">取消</button>
      <button class="primary" onclick="saveAvatar()">保存</button>
    </div>
  </div>
</div>

<!-- ★ 赛果记录弹窗 -->
<div id="resultModal" class="modal">
  <div class="modal-content">
    <h3>⚔️ 记录赛果</h3>
    <div id="resultMatchInfo" style="text-align:center;color:#f0c040;font-size:13px;font-weight:700;letter-spacing:1px"></div>

    <div class="section-title">谁获胜？</div>
    <div class="choice-group">
      <div class="choice-btn" data-winner="blue" onclick="selectWinner('blue')">🔵 蓝方胜</div>
      <div class="choice-btn" data-winner="red" onclick="selectWinner('red')">🔴 红方胜</div>
    </div>

    <div class="section-title">获胜方式</div>
    <div class="choice-group">
      <div class="choice-btn" data-result="normal" onclick="selectResultType('normal')">胜</div>
      <div class="choice-btn" data-result="perfect" onclick="selectResultType('perfect')">完胜</div>
      <div class="choice-btn" data-result="reverse3" onclick="selectResultType('reverse3')">反三</div>
    </div>

    <div class="hint" style="margin-top:0">
      💡 完胜：2:0 直落 ｜ 反三：单忍者残血连杀对面三人
    </div>

    <div class="modal-actions">
      <button onclick="closeResultModal()">取消</button>
      <button class="primary" onclick="confirmResult()">保存赛果</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
/* ==================== 默认数据（已拆分到 data.js） ==================== */
const DEFAULT_NINJAS = window.BP_DATA.ninjas;
const DEFAULT_SCROLLS = window.BP_DATA.scrolls;
const DEFAULT_SUMMONS = window.BP_DATA.summons;

/* ==================== BP 流程 ==================== */
const steps = [
  {team:'blue', type:'ban', count:1, label:'蓝方禁用第1名忍者'},
  {team:'red',  type:'ban', count:1, label:'红方禁用第1名忍者'},
  {team:'blue', type:'ban', count:1, label:'蓝方禁用第2名忍者'},
  {team:'red',  type:'ban', count:1, label:'红方禁用第2名忍者'},
  {team:'blue', type:'pick', count:1, label:'蓝方选择第1名忍者'},
  {team:'red',  type:'pick', count:2, label:'红方选择2名忍者（依次点击）'},
  {team:'blue', type:'pick', count:2, label:'蓝方选择2名忍者（依次点击）'},
  {team:'red',  type:'pick', count:1, label:'红方选择第1名忍者'},
  {team:'blue', type:'scroll', count:1, label:'蓝方选择秘卷1'},
  {team:'red',  type:'scroll', count:1, label:'红方选择秘卷1'},
  {team:'blue', type:'scroll', count:1, label:'蓝方选择秘卷2'},
  {team:'red',  type:'scroll', count:1, label:'红方选择秘卷2'},
  {team:'blue', type:'scroll', count:1, label:'蓝方选择秘卷3'},
  {team:'red',  type:'scroll', count:1, label:'红方选择秘卷3'},
  {team:'blue', type:'summon', count:1, label:'蓝方选择通灵1'},
  {team:'red',  type:'summon', count:1, label:'红方选择通灵1'},
  {team:'blue', type:'summon', count:1, label:'蓝方选择通灵2'},
  {team:'red',  type:'summon', count:1, label:'红方选择通灵2'},
  {team:'blue', type:'summon', count:1, label:'蓝方选择通灵3'},
  {team:'red',  type:'summon', count:1, label:'红方选择通灵3'},
  {team:'done', type:'done', count:0, label:'✅ BP完成！可保存记录或重置'}
];

/* ==================== 状态 ==================== */
let customData = {ninjas:[], scrolls:[], summons:[]};
let allNinjas = [], allScrolls = [], allSummons = [];
let blueBans=[], redBans=[], bluePicks=[], redPicks=[];
let blueScrolls=[], redScrolls=[], blueSummons=[], redSummons=[];
let usedNinjas = new Set();
let stepIndex = 0, stepSelected = 0;
let bluePlayerName = '', redPlayerName = '';
let currentTab = 'ninjas';
let pendingImageData = '';

let avatarMap = {};
let avatarMode = false;
let currentAvatarItem = null;

/* 赛果相关 */
let pendingResult = {winner: 'blue', resultType: 'normal'};
let pendingRecord = null;
let editingId = null;

/* ==================== 工具函数 ==================== */
function makeAvatar(name, type){
  const safeName = String(name).replace(/[「」\[\]·\s]/g,'');
  let ch = safeName.charAt(0) || '?';
  ch = ch.replace(/["'<>&]/g, '?');
  const colors = {ninja:'#1f4e8c', scroll:'#8a5a1a', summon:'#1a6b3a'};
  const bg = colors[type] || '#444';
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">' +
              '<rect width="64" height="64" rx="8" fill="' + bg + '"/>' +
              '<text x="32" y="42" font-size="26" fill="#fff" text-anchor="middle" ' +
              'font-family="sans-serif" font-weight="bold">' + ch + '</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function getItem(id, type){
  if(type === 'ninja') return allNinjas.find(x => x.id === id);
  if(type === 'scroll') return allScrolls.find(x => x.id === id);
  return allSummons.find(x => x.id === id);
}

function getName(id, type){
  const item = getItem(id, type);
  return item ? item.name : id;
}

function getAvatarUrl(item, type){
  if(avatarMap[item.id] && String(avatarMap[item.id]).trim() !== ''){
    return avatarMap[item.id];
  }
  if(item.img && String(item.img).trim() !== ''){
    return item.img;
  }
  return 'images/' + item.id + '.png';
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ==================== 数据加载 ==================== */
function loadCustom(){
  const s = localStorage.getItem('naruto_bp_custom');
  if(s){ try { customData = JSON.parse(s); } catch(e){ customData = {ninjas:[],scrolls:[],summons:[]}; } }
  if(!customData.ninjas) customData.ninjas = [];
  if(!customData.scrolls) customData.scrolls = [];
  if(!customData.summons) customData.summons = [];
}
function saveCustom(){
  try { localStorage.setItem('naruto_bp_custom', JSON.stringify(customData)); }
  catch(e){ alert('本地存储空间不足，请减少自定义图片数量或压缩图片尺寸'); }
}
function loadAvatars(){
  const s = localStorage.getItem('naruto_bp_avatars');
  try { avatarMap = s ? JSON.parse(s) : {}; } catch(e){ avatarMap = {}; }
}
function saveAvatars(){
  try { localStorage.setItem('naruto_bp_avatars', JSON.stringify(avatarMap)); }
  catch(e){ alert('头像存储空间不足！建议使用图片相对路径（如 images/xxx.png），或压缩图片尺寸'); }
}
function mergeData(){
  allNinjas = [...DEFAULT_NINJAS, ...customData.ninjas];
  allScrolls = [...DEFAULT_SCROLLS, ...customData.scrolls];
  allSummons = [...DEFAULT_SUMMONS, ...customData.summons];
}

/* ==================== 渲染 ==================== */
function render(){
  const st = document.getElementById('status');
  const step = steps[stepIndex] || steps[steps.length-1];
  if(!avatarMode) st.textContent = step.label;

  if(!avatarMode){
    if(step.type === 'ban' || step.type === 'pick'){
      if(currentTab !== 'ninjas') switchTab('ninjas', true);
    } else if(step.type === 'scroll'){
      if(currentTab !== 'scrolls') switchTab('scrolls', true);
    } else if(step.type === 'summon'){
      if(currentTab !== 'summons') switchTab('summons', true);
    }
  }

  updateTeamPanels();
  renderPool();
}

function updateTeamPanels(){
  function fill(elId, ids, type, cls){
    const el = document.getElementById(elId);
    el.innerHTML = ids.map(id => {
      const item = getItem(id, type);
      if(!item) return '';
      const img = getAvatarUrl(item, type);
      const fb = makeAvatar(item.name, type);
      return '<div class="mini-card ' + cls + '" title="' + esc(item.name) + '">' +
             '<img src="' + esc(img) + '" onerror="this.onerror=null;this.src=\'' + fb + '\'">' +
             '</div>';
    }).join('');
  }
  fill('blueBansGrid', blueBans, 'ninja', 'ban');
  fill('bluePicksGrid', bluePicks, 'ninja', 'pick-blue');
  fill('blueScrollsGrid', blueScrolls, 'scroll', 'pick-blue');
  fill('blueSummonsGrid', blueSummons, 'summon', 'pick-blue');
  fill('redBansGrid', redBans, 'ninja', 'ban');
  fill('redPicksGrid', redPicks, 'ninja', 'pick-red');
  fill('redScrollsGrid', redScrolls, 'scroll', 'pick-red');
  fill('redSummonsGrid', redSummons, 'summon', 'pick-red');
}

function switchTab(tab, silent){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  document.getElementById('rankFilter').style.display = (tab === 'ninjas') ? '' : 'none';
  if(!silent) renderPool();
}

function renderPool(){
  const tab = currentTab;
  const search = document.getElementById('search').value.toLowerCase().trim();
  const rank = document.getElementById('rankFilter').value;

  let data = tab === 'ninjas' ? allNinjas : (tab === 'scrolls' ? allScrolls : allSummons);
  if(tab === 'ninjas' && rank) data = data.filter(x => x.rank === rank);
  if(search) data = data.filter(x => x.name.toLowerCase().includes(search));

  const type = tab === 'ninjas' ? 'ninja' : (tab === 'scrolls' ? 'scroll' : 'summon');
  const grid = document.getElementById('poolGrid');

  if(data.length === 0){
    grid.innerHTML = '<div style="color:#8b949e;padding:20px;text-align:center;grid-column:1/-1">没有匹配结果</div>';
    return;
  }

  grid.innerHTML = data.map(item => {
    let cls = 'card', badges = '', disabled = false;

    if(type === 'ninja'){
      if(usedNinjas.has(item.id)){
        cls += ' used';
        disabled = avatarMode ? false : true;
        if(blueBans.includes(item.id)) badges = '<div class="badge ban">蓝禁</div>';
        else if(redBans.includes(item.id)) badges = '<div class="badge ban">红禁</div>';
        else if(bluePicks.includes(item.id)) badges = '<div class="badge blue">蓝选</div>';
        else if(redPicks.includes(item.id)) badges = '<div class="badge red">红选</div>';
      }
    } else if(type === 'scroll'){
      if(blueScrolls.includes(item.id)) badges += '<div class="badge blue">蓝</div>';
      if(redScrolls.includes(item.id)) badges += '<div class="badge red">红</div>';
    } else {
      if(blueSummons.includes(item.id)) badges += '<div class="badge blue">蓝</div>';
      if(redSummons.includes(item.id)) badges += '<div class="badge red">红</div>';
    }

    if(avatarMode) cls += ' avatar-mode';

    const img = getAvatarUrl(item, type);
    const fb = makeAvatar(item.name, type);
    const sub = item.rank || '';
    const click = disabled ? '' : 'onclick="onCardClick(\'' + item.id + '\',\'' + type + '\')"';

    return '<div class="' + cls + '" ' + click + '>' +
           '<div class="thumb"><img src="' + esc(img) + '" onerror="this.onerror=null;this.src=\'' + fb + '\'"></div>' +
           '<div class="name">' + esc(item.name) + '</div>' +
           (sub ? '<div class="rank">' + esc(sub) + '</div>' : '') +
           badges +
           '</div>';
  }).join('');
}

/* ==================== 点击卡片 ==================== */
function onCardClick(id, type){
  if(avatarMode){
    openAvatarModal(id, type);
    return;
  }

  if(stepIndex >= steps.length) return;
  const step = steps[stepIndex];
  if(step.type === 'done') return;
  const team = step.team, ct = step.type;

  if(type === 'ninja' && ct !== 'ban' && ct !== 'pick') return;
  if(type === 'scroll' && ct !== 'scroll') return;
  if(type === 'summon' && ct !== 'summon') return;

  if(type === 'ninja' && usedNinjas.has(id)) return;
  if(type === 'scroll'){
    if(team === 'blue' && blueScrolls.includes(id)) return;
    if(team === 'red' && redScrolls.includes(id)) return;
  }
  if(type === 'summon'){
    if(team === 'blue' && blueSummons.includes(id)) return;
    if(team === 'red' && redSummons.includes(id)) return;
  }

  if(ct === 'ban'){
    if(team === 'blue') blueBans.push(id); else redBans.push(id);
    usedNinjas.add(id);
  } else if(ct === 'pick'){
    if(team === 'blue') bluePicks.push(id); else redPicks.push(id);
    usedNinjas.add(id);
  } else if(ct === 'scroll'){
    if(team === 'blue') blueScrolls.push(id); else redScrolls.push(id);
  } else if(ct === 'summon'){
    if(team === 'blue') blueSummons.push(id); else redSummons.push(id);
  }

  stepSelected++;
  if(stepSelected >= step.count){
    stepIndex++;
    stepSelected = 0;
  }
  render();
}

/* ==================== 头像模式 ==================== */
function toggleAvatarMode(){
  avatarMode = !avatarMode;
  const btn = document.getElementById('avatarModeBtn');
  btn.classList.toggle('active', avatarMode);
  btn.textContent = avatarMode ? '✅ 头像模式' : '🖼 设置头像';
  const st = document.getElementById('status');
  if(avatarMode){
    st.textContent = '🖼 头像模式：点击任意卡片设置头像（不再触发BP）';
    st.style.color = '#f0c040';
  } else {
    st.textContent = steps[stepIndex]?.label || '准备开始';
    st.style.color = '#58a6ff';
  }
  renderPool();
}

function openAvatarModal(id, type){
  const item = getItem(id, type);
  if(!item) return;
  currentAvatarItem = {id, type, name: item.name};

  document.getElementById('avatarItemInfo').textContent =
    '🎯 ' + item.name + '（ID：' + id + '）';

  const current = avatarMap[id] || item.img || '';
  const preview = document.getElementById('avatarPreview');
  if(current){
    preview.src = current;
    preview.style.display = '';
  } else {
    preview.style.display = 'none';
    preview.src = '';
  }
  preview.dataset.dataUrl = current;

  document.getElementById('avatarFile').value = '';
  document.getElementById('avatarUrl').value = '';

  document.getElementById('avatarModal').classList.add('show');
}

function closeAvatarModal(){
  document.getElementById('avatarModal').classList.remove('show');
  currentAvatarItem = null;
}

function previewAvatar(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const preview = document.getElementById('avatarPreview');
    preview.src = ev.target.result;
    preview.style.display = '';
    preview.dataset.dataUrl = ev.target.result;
    document.getElementById('avatarUrl').value = '';
  };
  reader.readAsDataURL(file);
}

function previewAvatarUrl(url){
  if(!url) return;
  const preview = document.getElementById('avatarPreview');
  preview.src = url;
  preview.style.display = '';
  preview.dataset.dataUrl = url;
  document.getElementById('avatarFile').value = '';
}

function saveAvatar(){
  if(!currentAvatarItem) return;
  const preview = document.getElementById('avatarPreview');
  const dataUrl = preview.dataset.dataUrl;
  if(!dataUrl){
    alert('请先上传图片或填写图片URL');
    return;
  }
  avatarMap[currentAvatarItem.id] = dataUrl;
  saveAvatars();
  closeAvatarModal();
  render();
}

function clearAvatar(){
  if(!currentAvatarItem) return;
  if(!confirm('清除「' + currentAvatarItem.name + '」的头像？')) return;
  delete avatarMap[currentAvatarItem.id];
  saveAvatars();
  closeAvatarModal();
  render();
}

/* ==================== 选手名字 ==================== */
function setPlayerName(team, name){
  if(team === 'blue') bluePlayerName = name.trim();
  else redPlayerName = name.trim();
  updatePlayerDisplay();
}

function updatePlayerDisplay(){
  document.getElementById('blueTitle').textContent =
    bluePlayerName ? '蓝方 · ' + bluePlayerName : '蓝方';
  document.getElementById('redTitle').textContent =
    redPlayerName ? '红方 · ' + redPlayerName : '红方';
}

/* ==================== BP 历史记录 ==================== */
function getBPHistory(){
  const s = localStorage.getItem('naruto_bp_history');
  try { return s ? JSON.parse(s) : []; } catch(e){ return []; }
}

function saveBPHistory(){
  const total = blueBans.length + redBans.length + bluePicks.length +
                redPicks.length + blueScrolls.length + redScrolls.length +
                blueSummons.length + redSummons.length;
  if(total === 0){ alert('还没有BP数据可保存'); return; }
  const record = {
    id: 'bp_' + Date.now(),
    time: new Date().toLocaleString('zh-CN', {hour12:false}),
    blueName: bluePlayerName || '蓝方',
    redName: redPlayerName || '红方',
    blueBans: [...blueBans], redBans: [...redBans],
    bluePicks: [...bluePicks], redPicks: [...redPicks],
    blueScrolls: [...blueScrolls], redScrolls: [...redScrolls],
    blueSummons: [...blueSummons], redSummons: [...redSummons],
    winner: null, resultType: null
  };
  openResultModal(record);
}

function renderHistory(){
  const history = getBPHistory();
  const container = document.getElementById('historyList');
  if(history.length === 0){
    container.innerHTML = '<div style="color:#8b949e;padding:16px;font-size:13px;text-align:center">暂无BP记录</div>';
    return;
  }
  container.innerHTML = history.map(r => {
    const blueBanStr = r.blueBans.map(id => getName(id,'ninja')).join('、') || '无';
    const redBanStr = r.redBans.map(id => getName(id,'ninja')).join('、') || '无';
    const resultText = getResultText(r);
    const resultCls = r.winner === 'blue' ? 'blue' : (r.winner === 'red' ? 'red' : 'none');
    return '<div class="history-item">' +
      '<div class="history-time">' + esc(r.time) + '</div>' +
      '<div class="history-names">' + esc(r.blueName) + ' vs ' + esc(r.redName) + '</div>' +
      '<div class="history-result ' + resultCls + '">' + esc(resultText) + '</div>' +
      '<div class="history-summary">蓝禁：' + esc(blueBanStr) + '<br>红禁：' + esc(redBanStr) + '</div>' +
      '<div class="history-actions">' +
        '<button onclick="loadHistory(\'' + r.id + '\')">回放</button>' +
        '<button onclick="editResult(\'' + r.id + '\')">改赛果</button>' +
        '<button class="danger" onclick="deleteHistory(\'' + r.id + '\')">删除</button>' +
      '</div></div>';
  }).join('');
}

function getResultText(r){
  if(!r.winner) return '⏸ 未记录赛果';
  const winnerName = r.winner === 'blue' ? (r.blueName || '蓝方') : (r.redName || '红方');
  const flag = r.winner === 'blue' ? '🔵' : '🔴';
  let resultText = '';
  if(r.resultType === 'perfect') resultText = ' · 完胜';
  else if(r.resultType === 'reverse3') resultText = ' · 反三';
  else resultText = ' · 胜';
  return flag + ' ' + winnerName + resultText;
}

function loadHistory(id){
  const r = getBPHistory().find(x => x.id === id);
  if(!r) return;
  if(!confirm('加载 ' + r.blueName + ' vs ' + r.redName + ' 的BP记录？当前BP将被覆盖。')) return;

  blueBans = [...r.blueBans]; redBans = [...r.redBans];
  bluePicks = [...r.bluePicks]; redPicks = [...r.redPicks];
  blueScrolls = [...r.blueScrolls]; redScrolls = [...r.redScrolls];
  blueSummons = [...r.blueSummons]; redSummons = [...r.redSummons];
  bluePlayerName = r.blueName === '蓝方' ? '' : r.blueName;
  redPlayerName = r.redName === '红方' ? '' : r.redName;

  usedNinjas = new Set([...blueBans, ...redBans, ...bluePicks, ...redPicks]);
  stepIndex = steps.length - 1;
  stepSelected = 0;

  document.getElementById('blueNameInput').value = bluePlayerName;
  document.getElementById('redNameInput').value = redPlayerName;
  updatePlayerDisplay();
  render();
}

function deleteHistory(id){
  if(!confirm('删除这条记录？')) return;
  const history = getBPHistory().filter(x => x.id !== id);
  localStorage.setItem('naruto_bp_history', JSON.stringify(history));
  renderHistory();
}

function clearHistory(){
  if(!confirm('确定清空所有BP历史记录？此操作不可恢复。')) return;
  localStorage.removeItem('naruto_bp_history');
  renderHistory();
}

/* ==================== 赛果记录 ==================== */
function openResultModal(record){
  pendingRecord = record;
  editingId = null;
  pendingResult = {winner: 'blue', resultType: 'normal'};
  updateResultUI();
  document.getElementById('resultMatchInfo').textContent =
    (record.blueName || '蓝方') + '  vs  ' + (record.redName || '红方');
  document.getElementById('resultModal').classList.add('show');
}

function editResult(id){
  const r = getBPHistory().find(x => x.id === id);
  if(!r) return;
  editingId = id;
  pendingResult = {
    winner: r.winner || 'blue',
    resultType: r.resultType || 'normal'
  };
  pendingRecord = {
    id: r.id, time: r.time,
    blueName: r.blueName, redName: r.redName,
    blueBans: r.blueBans, redBans: r.redBans,
    bluePicks: r.bluePicks, redPicks: r.redPicks,
    blueScrolls: r.blueScrolls, redScrolls: r.redScrolls,
    blueSummons: r.blueSummons, redSummons: r.redSummons
  };
  updateResultUI();
  document.getElementById('resultMatchInfo').textContent =
    (r.blueName || '蓝方') + '  vs  ' + (r.redName || '红方') + '（修改赛果）';
  document.getElementById('resultModal').classList.add('show');
}

function closeResultModal(){
  document.getElementById('resultModal').classList.remove('show');
  pendingRecord = null;
  editingId = null;
}

function selectWinner(w){
  pendingResult.winner = w;
  updateResultUI();
}

function selectResultType(t){
  pendingResult.resultType = t;
  updateResultUI();
}

function updateResultUI(){
  document.querySelectorAll('#resultModal .choice-btn').forEach(btn => {
    if(btn.dataset.winner){
      btn.classList.toggle('active', btn.dataset.winner === pendingResult.winner);
    }
    if(btn.dataset.result){
      btn.classList.toggle('active', btn.dataset.result === pendingResult.resultType);
    }
  });
}

function confirmResult(){
  if(!pendingRecord) return;
  pendingRecord.winner = pendingResult.winner;
  pendingRecord.resultType = pendingResult.resultType;

  const history = getBPHistory();

  if(editingId){
    // 编辑模式：找到原记录替换
    const idx = history.findIndex(x => x.id === editingId);
    if(idx >= 0) history[idx] = pendingRecord;
    try { localStorage.setItem('naruto_bp_history', JSON.stringify(history)); }
    catch(e){ alert('存储空间不足，无法保存'); return; }
    editingId = null;
  } else {
    // 新记录：插入最前
    history.unshift(pendingRecord);
    if(history.length > 50) history.length = 50;
    try { localStorage.setItem('naruto_bp_history', JSON.stringify(history)); }
    catch(e){ alert('存储空间不足，无法保存历史记录'); return; }
  }

  renderHistory();
  closeResultModal();
  alert('✅ 赛果已保存');
}

/* ==================== 重置 ==================== */
function resetBP(){
  if(!confirm('确定重置当前BP？')) return;
  blueBans=[]; redBans=[]; bluePicks=[]; redPicks=[];
  blueScrolls=[]; redScrolls=[]; blueSummons=[]; redSummons=[];
  usedNinjas = new Set();
  stepIndex = 0; stepSelected = 0;
  render();
}

/* ==================== 添加自定义内容 ==================== */
function openAddModal(){
  document.getElementById('addModal').classList.add('show');
  document.getElementById('addName').value = '';
  pendingImageData = '';
  const prev = document.getElementById('imagePreview');
  prev.style.display = 'none';
  prev.src = '';
  document.getElementById('addImage').value = '';
  updateAddForm();
}

function closeAddModal(){
  document.getElementById('addModal').classList.remove('show');
}

function updateAddForm(){
  const type = document.getElementById('addType').value;
  const extra = document.getElementById('addExtra');
  if(type === 'ninja'){
    extra.innerHTML = '<label>等级<select id="addRank"><option>S</option><option>A</option><option>B</option><option>C</option></select></label>';
  } else {
    extra.innerHTML = '';
  }
}

function previewImage(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    pendingImageData = ev.target.result;
    const prev = document.getElementById('imagePreview');
    prev.src = pendingImageData;
    prev.style.display = '';
  };

function addItem(){
  const type = document.getElementById('addType').value;
  const name = document.getElementById('addName').value.trim();
  if(!name){ alert('请输入名称'); return; }

  const id = 'custom_' + type + '_' + Date.now();
  const item = {id, name, img: pendingImageData || ''};

  if(type === 'ninja'){
    item.rank = document.getElementById('addRank').value;
    customData.ninjas.push(item);
  } else if(type === 'scroll'){
    customData.scrolls.push(item);
  } else {
    customData.summons.push(item);
  }

  saveCustom();
  mergeData();
  closeAddModal();
  render();
  alert('✅ 已添加：' + name);
}

/* ==================== 导入导出 ==================== */
function exportData(){
  const data = {
    version: 4,
    exportTime: new Date().toISOString(),
    custom: customData,
    history: getBPHistory(),
    avatars: avatarMap
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'naruto_bp_data_' + Date.now() + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try {
      const data = JSON.parse(ev.target.result);
      if(data.custom){
        customData = data.custom;
        if(!customData.ninjas) customData.ninjas = [];
        if(!customData.scrolls) customData.scrolls = [];
        if(!customData.summons) customData.summons = [];
        saveCustom();
      }
      if(data.history && Array.isArray(data.history)){
        localStorage.setItem('naruto_bp_history', JSON.stringify(data.history));
      }
      if(data.avatars && typeof data.avatars === 'object'){
        avatarMap = data.avatars;
        saveAvatars();
      }
      mergeData();
      render();
      renderHistory();
      alert('✅ 导入成功');
    } catch(err){
      alert('导入失败：' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ==================== 初始化 ==================== */
window.addEventListener('load', function(){
  loadCustom();
  loadAvatars();
  mergeData();
  updateAddForm();
  switchTab('ninjas', true);
  render();
  renderHistory();
  updatePlayerDisplay();
});

document.getElementById('addModal').addEventListener('click', function(e){
  if(e.target === this) closeAddModal();
});
document.getElementById('avatarModal').addEventListener('click', function(e){
  if(e.target === this) closeAvatarModal();
});
document.getElementById('resultModal').addEventListener('click', function(e){
  if(e.target === this) closeResultModal();
});
</script>
